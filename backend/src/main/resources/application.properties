# Server Configuration
# Embedded HTTP server (Tomcat) port - used for health checks and metrics
server.port=9091
stockcast.server.host=0.0.0.0
# Port used by the custom StockCast TCP server (separate from embedded Tomcat)
# This is the main port clients connect to
stockcast.server.port=9090

# Stock Price Generation Configuration
stockcast.price.update.interval=1000
stockcast.price.initial.aapl=150.0
stockcast.price.initial.goog=2800.0
stockcast.price.initial.msft=380.0
stockcast.price.initial.amzn=3400.0
stockcast.price.initial.tsla=250.0

# Logging
logging.level.com.stockcast=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
